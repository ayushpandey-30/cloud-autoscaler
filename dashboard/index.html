<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Auto-Scaler Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f8; color: #222; }
  h1 { margin-bottom: 4px; }
  .sub { color: #666; margin-bottom: 14px; }
  .cards { display: flex; gap: 12px; margin-bottom: 16px; }
  .card { background: #fff; padding: 12px 18px; border-radius: 8px; flex: 1;
          box-shadow: 0 1px 3px #0002; }
  .card span { font-size: 13px; color: #666; }
  .card b { display: block; font-size: 28px; }
  .box { background: #fff; padding: 12px; border-radius: 8px; margin-bottom: 16px;
         box-shadow: 0 1px 3px #0002; height: 280px; }
  table { width: 100%; border-collapse: collapse; background: #fff;
          border-radius: 8px; box-shadow: 0 1px 3px #0002; }
  td, th { padding: 6px 10px; border-bottom: 1px solid #ddd; text-align: left; font-size: 14px; }
</style>
</head>
<body>
<h1>AI Cloud Auto-Scaler</h1>
<div class="sub">Data source: <span id="source">-</span> (refreshes every 3 s)</div>

<div class="cards">
  <div class="card"><span>Current load (req/s)</span><b id="c-rps">-</b></div>
  <div class="card"><span>Predicted in 30 s (req/s)</span><b id="c-pred">-</b></div>
  <div class="card"><span>Instances (decision)</span><b id="c-inst">-</b></div>
  <div class="card"><span>Containers running now</span><b id="c-cont">-</b></div>
</div>

<div class="box"><canvas id="load"></canvas></div>
<div class="box"><canvas id="inst"></canvas></div>

<h3>Scaling decisions (latest first)</h3>
<table>
  <thead><tr><th>Time (s)</th><th>Action</th><th>Load</th><th>Predicted</th><th>Instances</th></tr></thead>
  <tbody id="log"></tbody>
</table>

<script>
const xTitle = { display: true, text: "seconds since scaler started" };

const loadChart = new Chart(document.getElementById("load"), {
  type: "line",
  data: { labels: [], datasets: [
    { label: "Actual requests/sec", data: [], borderColor: "#2563eb", tension: 0.2 },
    { label: "Predicted (30 s ahead)", data: [], borderColor: "#f97316",
      borderDash: [6, 4], tension: 0.2 }
  ]},
  options: { maintainAspectRatio: false, animation: false,
    scales: { x: { title: xTitle }, y: { beginAtZero: true,
      title: { display: true, text: "requests/sec" } } } }
});

const instChart = new Chart(document.getElementById("inst"), {
  type: "line",
  data: { labels: [], datasets: [
    { label: "Instances", data: [], borderColor: "#16a34a",
      backgroundColor: "#16a34a33", fill: true, stepped: true }
  ]},
  options: { maintainAspectRatio: false, animation: false,
    scales: { x: { title: xTitle }, y: { beginAtZero: true, ticks: { stepSize: 1 },
      title: { display: true, text: "instances" } } } }
});

function show(v) { return v === null || v === undefined ? "-" : v; }

async function refresh() {
  try {
    const d = await (await fetch("/api/data")).json();
    const rows = d.rows;
    document.getElementById("source").textContent = d.source || "no log yet";
    if (!rows.length) return;

    const labels = rows.map(r => r.t);
    loadChart.data.labels = labels;
    loadChart.data.datasets[0].data = rows.map(r => r.rps);
    loadChart.data.datasets[1].data = rows.map(r => r.predicted);
    loadChart.update();
    instChart.data.labels = labels;
    instChart.data.datasets[0].data = rows.map(r => r.instances);
    instChart.update();

    const last = rows[rows.length - 1];
    document.getElementById("c-rps").textContent = show(last.rps);
    document.getElementById("c-pred").textContent = show(last.predicted);
    document.getElementById("c-inst").textContent = show(last.instances);
    document.getElementById("c-cont").textContent = show(d.containers);

    const acts = rows.filter(r => r.action !== "hold").reverse().slice(0, 10);
    document.getElementById("log").innerHTML = acts.map(r =>
      `<tr><td>${r.t}</td><td>${r.action}</td><td>${show(r.rps)}</td>` +
      `<td>${show(r.predicted)}</td><td>${r.instances}</td></tr>`).join("");
  } catch (e) { /* server not ready yet, try again */ }
}
setInterval(refresh, 3000);
refresh();
</script>
</body>
</html>
